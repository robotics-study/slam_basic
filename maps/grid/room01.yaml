# registration 갈래의 무대 — 빈 직사각 방. 이게 이 갈래의 정직한 최소 조건이다.
# 순차 점-점 대응(NN)이 매 스텝 참된 쌍을 만들려면 인접한 두 스캔이 물리적으로 같은 구조를
# 둘 다 보여야 한다. 통로에 장애물(핀/슬롯)을 넣으면 그 조건이 꺾인다: 로봇이 장애물을 지나는
# 바로 그 스텝에서 새 면은 이전 스캔에 존재하지 않았고(정면 부채꼴이 가려 못 봄), 같은 로봇 좌표
# 위치에 겹치는 옛 면과의 오짝시가 대응을 정체(identity)로 끌어내린다 — 실험으로 확인된 한계.
# 그래서 이 방은 비어 있다. 진행 방향에 수직인 면(오른쪽 끝벽 x=4)이 항상 사거리 안에 있고,
# 양 옆의 긴 벽의 격자 점들이 y 와 회전을 잡는다 — 매 스텝 구조가 두 스캔 모두에 보인다.
type: occupancy_grid
image: room01.pgm       # 0(검정)=occupied, 255(흰색)=free
resolution: 0.5         # meters / pixel → world 5.0 x 3.5 m (내부 자유 공간 x∈(1,4), y∈(0.5,3))
origin: [0.0, 0.0]      # 이미지 좌하단 픽셀의 world pose — θ 는 쓰지 않는다
