# 매핑 투어 — 오피스 전체를 훑는 지그재그+나선. grid_mapping의 정본 시나리오다.
# 두 방을 가로지르며 각 면(face)을 every 방향에서 스캔하도록 경로를 짠다: 좌방 중앙을
# 서쪽으로(좌측 벽·블록 A 동쪽 면), 슬롯을 북상(블록 A 서쪽 면), 블록 A 위를 동쪽(꼭대기
# 면), 하단을 동쪽, 문을 지나 우방, 우측 벽을 따라 하강 후 하단 서쪽(블록 B 아래·바닥
# 벽 동편), 마지막에 문을 다시 북상해 우상부까지. 180° FOV에서 수평 주사는 좌/우 면과
# (수직 빔으로) 상/하면을 모두 덮고, 수직 주사는 반대 방향의 면들을 덮는다.
# 오도메트리 노이즈는 0 — 이 갈래의 전제가 "알려진 자세"다. 추정 자세는 선언된 출발
# 자세(x0/y0/theta_deg 파라미터)에 무노이즈 오도메트리를 적분한 값으로, 정본과 (부동소수
# 반올림 수준) 일치한다. 드리프트로 지도가 번지는 현상은 filter_based 갈래의 몫.
# 센서 노이즈(σ_range)는 그대로 두는 것이 정직하다: 착지점이 경계에 정확히 떨어지면
# floor 규칙상 자유 셀 쪽으로 넘어가므로, 벽 셀은 노이즈로 안쪽에 떨어진 착지점들로만
# +log-odds를 쌓는다. 두꺼운 장애물 내부와 막힌 모서리 셀은 물리적으로 관측 불가 —
# 그것들이 미지로 남는 것이 IoU가 1.0에 못 미치는 이유다(unknown ≠ occupied).
# 출발 heading 은 정확히 서쪽: atan2(+0.0, −5.0) = +π 이고 math.radians(180.0) 도 같은
# double — 앵커가 정본과 비트 단위로 같다.
map: ../grid/office01.yaml
path:
  - [5.875, 4.375]           # 출발 — 정확히 서쪽 (θ₀ = atan2(+0.0, −) = +π)
  - [0.875, 4.375]           # 좌방 중앙을 서쪽으로
  - [0.875, 7.875]           # 슬롯(블록 A 서쪽 골목)을 북상
  - [2.625, 7.875]           # 블록 A 위를 동쪽
  - [2.625, 1.375]           # 블록 A 동쪽에서 하강
  - [5.875, 1.375]           # 좌방 하단을 동쪽
  - [5.875, 4.375]           # 문 높이까지 상승
  - [10.875, 4.375]          # 문을 지나 우방 중앙을 동쪽
  - [10.875, 1.375]          # 우측 벽을 따라 하강
  - [7.625, 1.375]           # 블록 B 아래(좁은 통로)를 서쪽
  - [7.625, 7.875]           # 문을 다시 북상해 우상부까지 — 나선 종료
step_meters: 0.4             # 약 103 스텝
sensor:
  type: beam
  beams: 90
  fov_deg: 180.0
  range_max: 6.5
  sigma_range: 0.05          # m — 착지점 노이즈는 유지 (위 주석 참조)
odom_noise:
  sigma_xy: 0.0              # 알려진 자세 — 드리프트 없음 (ATE ≈ 0)
  sigma_theta: 0.0
seed: 42
