# registration 갈래의 두 번째 정본 시나리오 — 계단식 대각 통과. NDT 는 대응을 만들지 않는다:
# 셀에 담긴 점들이 만드는 확률 분포(blob) 위로 변환된 소스 점을 그대로 얹어 점수를 낸다. 축에
# 평행한 벽만 있는 방에서는 이 방법이 정직하게 실패한다 — 벽의 점은 그 벽 전체로 퍼져 있으니
# 클러스터가 벽 방향을 따라 병진 불변이고, score 는 그 축을 따른 신호를 잃는다. 같은 σ 로
# room01_straight 에서 돌리면 8 스텝 중 6 개만 복원되고 스텝 2 는 아예 정체로 붕괴한다
# (dx = −0.0011, 참값 +0.25; 그 스텝의 실측 기울기 |∂score/∂x| = 0.037 대 |∂score/∂y| = 169) —
# ATE 0.334 (ICP 는 같은 지도에서 0.021). 계단은 그 알리아싱을 깨는 최소의 구조다: 각 riser 가
# 행 하나 높이(셀 하나)에 정확히 들어맞아 클러스터가 두 축으로 모두 유한하고, 그때 비로소 x 와 y
# 가 모두 신호를 나른다. 기하: 내부 자유 공간 y∈(0.5,3), 서쪽 face x=1. 동쪽 계단의 내면 face 들은
# 위에서 아래로 x = 2.5 / 3.0 / 3.5 / 4.0 / 4.5 — y 가 내려갈수록 경계가 동쪽으로 물러난다.
# 경로(y=1.75 의 행)에서 정면 face 는 x=3.5.
# 경로가 x=2.75 에서 멈추는 것도 연출이 아니라 물리다: 그 행의 자유 공간이 face x=3.5 에서 끝나고,
# x=3.25 까지 늘려 실측하면 붕괴는 없지만 마지막 스텝의 y/θ 오차가 자란다(twist +0.2498/+0.0498/
# +0.0103, ATE 0.054 대 0.052) — 정면 riser 가 treads 를 시야에서 밀어내기 때문이다. 출발점
# (1.75, 1.75) 에서 정면 face(x=3.5)까지 1.75 m — 첫 스텝의 참된 변위 0.25 는 blob 폭이 덮고
# 남는다. NDT 의 포획 범위는 ICP 의 d_max 같은 컷오프가 아니라 blob 폭 자체(셀과 σ 가 만드는
# 넓이)다. 91빔/90° = 정확히 1° 간격은 room01 과 같은 각도 샘플링 밀도. range_max 3.5 는 출발점에서
# 보이는 가장 먼 점(계단 끝 (4.5, 0.5), √(2.75²+1.25²) ≈ 3.02)을 덮는다 — 잘리는 빔 없이 미스는
# 전부 진짜 반사물 없음. sigma_range 0.02: 등록 갈래의 정직한 센서 등급(LiDAR 급) — 클러스터가
# 법선 방향으로 얼마나 얇은지를 만드는 실측 요소가 곧 이 σ 다.
# odom_noise = 0: NDT 는 Step.odom 을 전혀 소비하지 않는다 — 게이지 포즈(선언)에서 출발한 추정 위에
# 스텝마다 복원된 twist 만 합성하므로, 데모의 추정-정본 차이가 곧 순수한 등록 오차다.
map: ../grid/room02.yaml
path:                        # 웨이포인트(world 좌표) — y=1.75 중심선을 동쪽으로 4 이동
  - [1.75, 1.75]             # 출발 — 게이지 포즈(x0/y0/theta_deg)와 같은 점, 계단이 부채꼴에 비스듬히 걸림
  - [2.75, 1.75]             # 정지 — 그 행의 자유 공간 끝(face x=3.5) 직전 (위 주석)
step_meters: 0.25            # 등아크 재샘플 간격 → 4 이동 + 출발 = 5 스텝 (위 주석)
sensor:
  type: beam                 # 빔 스캔 — 알고리즘은 오도메트리 없이 이 점들만 소비한다
  beams: 91                  # 양끝 포함 균일 각도 → 정확히 1° 간격 (fov/(beams−1) = 90/90)
  fov_deg: 90.0              # 전방 부채꼴 ±45° — 닫힌 방이라 모든 빔은 어딘가에 맞는다(미스 없음)
  range_max: 3.5             # 출발점에서 가장 먼 가시점까지 덮는 사거리 — 잘림 없음 (위 주석)
  sigma_range: 0.02          # LiDAR 급 거리 노이즈 σ — 클러스터의 법선 폭을 만드는 실측 요소
odom_noise:                  # 알고리즘이 소비하지 않는 오도메트리 — 정본과 정확히 일치한다 (위 주석)
  sigma_xy: 0.0
  sigma_theta: 0.0
seed: 42
