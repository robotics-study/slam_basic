# 입자 필터 갈래의 무대 — corridor02 의 그 주기적 복도를 다시 쓰되, 이번엔 상태를 이산화하지
# 않는다. 오도메트리 노이즈가 0 인 것은 정직함의 기만이 아니라 논리다: 격자 갈래는 불확실성을
# slip(이산 전이)으로 표현했으니 노이즈 자체가 무의미했고, 이 갈래에서 드리프트는 시나리오가
# 아니라 필터의 운동 모델 안에 산다(입자마다 ε ~ N(0, σ²) 를 그린다 — configs 의 sigma_xy/
# sigma_theta 가 그 필터의 선언이고 여기 시나리오는 정확히 격자 정렬된 twist 만 명령한다).
# 센서는 90° 부채꼴 45 빔: 전체 원이 아니라 앞만 본다. c8 중심의 구조는 점대칭(열 6↔10 이
# x=4.25 에 대해 서로의 거울)이라 동쪽 스캔과 서쪽 스캔이 정확히 같다 — 출발 셀에서 입자 구름은
# 동/서 쌍둥이 두 덩어리로 갈라지고 첫 동쪽 이동이 서쪽 덩어리를 죽인다(다봉성 가시화).
# sigma_range 0.3 은 설계 변수다: 날카로운 우도(0.05)는 유한 입자로는 커버되지 않는다 — 셀 하나를
# 균일 샘플로 덮어도 우도의 지지집합(±σ 대역)에 입자가 떨어질 기대값이 1 미만이면 필터는 운 좋은
# 입자 하나로 잠기고 칩을 돌릴 때마다 다른 결론이 나온다. 빈약한 센서는 이 갈래의 정직한 조건이다:
# 샘플링 기반 추정은 우도가 뭉툭할 때 유한 N 으로 커버된다. 그 대가로 위치 지표는 ~σ/√k 수준(수 cm)에
# 멈추고, 가로 방향(y)은 복도 구간에서 관측되지 않아 구름이 그 폭을 계속 들고 있다 테일 룸의 수평
# 면이 보이며 접힌다 — 이 전부 데모에서 눈으로 보인다.
map: ../grid/corridor02.yaml
path:                        # 웨이포인트(world 좌표, 셀 중심) — ambiguous 와 같은 왕복
  - [4.25, 1.75]             # cell (r3,c8) — 출발. 점대칭 중심이라 동/서 스캔이 정확히 같다
  - [13.25, 1.75]            # cell (r3,c26) — 테일(열고 넓은 방)의 중심에서 회전
  - [4.25, 1.75]             # cell (r3,c8)  — 귀환
step_meters: 0.5             # 등아크 재샘플 간격 = 셀 크기 → 왕복 36 이동 + 출발 = 37 스텝
sensor:
  type: beam                 # 빔 스캔 — 알고리즘은 자기 추정 자세로 world 를 복원해야 한다
  beams: 45                  # fov 를 양끝 포함 균일 각도로 쪼갠다 (2° 간격)
  fov_deg: 90.0              # 앞 부채꼴 ±45° — 위 주석의 점대칭으로 동/서 쌍둥이는 보존된다
  range_max: 2.5             # 인접 면만 보고 다다음 면은 항상 밖 (corridor02 와 같은 사정거리)
  sigma_range: 0.3           # 빈약한 거리 노이즈 — 위 주석의 설계 변수, 우도의 뭉툭함 그 자체
odom_noise:                  # 알고리즘이 소비하는 오도메트리 — 여기서는 정확하다
  sigma_xy: 0.0              # 명령은 격자의 정수배 이동 그대로 — 드리프트는 필터 안에 있다
  sigma_theta: 0.0           # 헤딩도 정확히 0 또는 ±π 만 — 회전 노이즈 역시 필터의 ε 몫
seed: 42
