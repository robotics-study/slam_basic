# registration 갈래의 정본 시나리오 — 직선 통과. 경로가 직선인 것은 연출이 아니라 이 갈래의
# 물리다: 순차 점-점 대응은 순간 90° 회전을 복원할 수 없다 — 회전 스텝 양쪽 스캔이 공유하는
# 물리 점이 (코너 모서리 몇 개를 빼면) 없어서 대응 자체가 정의되지 않기 때문이다. 직선에서는
# 반대로, 진행 방향에 수직인 면(끝벽 x=4)의 점들이 두 consecutive 스캔 모두에 같은 물리 점으로
# 보인다 — 그 참된 쌍들이 dx 를 정확히 끌어당기고, 양 옆 긴 벽(y=0.5/3.5 면)의 격자 점들이
# y 와 회전을 잡는다. 핀이 있는 복도에서 이 알고리즘이 죽는 이유(지도 주석 참조)가 곧 여기
# 직선 방이 사는 이유다 — 같은 지도 계열의 다른 갈래들이 모호성을 가르치는 무대라면, 이건
# 등록이 작동할 수 있는 최소의 지형이다.
# 출발 x=1.25: 끝벽까지 2.75 m — range_max 3.5 는 어떤 스텝에서든 보이는 모든 면을 덮는다
# (최대 가시 거리 √(2.75²+1.25²) ≈ 3.02 < 3.5). 즉 여기선 사거리로 잘리는 빔이 없다 —
# 미스는 전부 진짜 "표면 없음"이다. 경로가 벽 안으로 들어가지 않도록 끝점은 x=3.25 에서 선다
# (자유 공간 x<4). 스텝 0.25 m 는 셀 절반이고, 91빔/90° = 정확히 1° 간격 — 각도 샘플링이
# 격자 점을 이산화하는 밀도 자체가 등록의 오차 바닥(σ_range 와 함께)이다.
# sigma_range 0.02: 등록 갈래의 정직한 센서 등급 — LiDAR 급 mm~cm. σ 가 곧 오차 바닥의 절반이고
# (노이즈 없는 스캔으로 돌리면 ATE 가 1/7 로 줄어드는 것을 페이지에서 보여 준다) 빈약한 0.3 은
# 샘플링 갈래의 사정이지 여기가 아니다.
# odom_noise = 0: 정직함의 기만이 아니라 논리다 — ICP 는 Step.odom 을 전혀 소비하지 않는다.
# 무노이즈 명령은 사산법이 정본과 일치한다는 선언이고, 따라서 데모에서 추정 궤적이 정본에서
# 벗어나는 정도가 곧 순수한 등록 오차다 (필터링 갈래가 드리프트를 보여주기 위해 노이즈를 켰던
# 것과 같은 장치의 반대면).
map: ../grid/room01.yaml
path:                        # 웨이포인트(world 좌표) — y=1.75 중심선을 동쪽으로 8 이동
  - [1.25, 1.75]             # 출발 — 게이지 포즈(x0/y0/theta_deg)와 같은 점
  - [3.25, 1.75]             # 끝벽 앞(자유 공간 끝 x=4)에서 정지 — 마지막 스캔도 끝벽을 정면으로 본다
step_meters: 0.25            # 등아크 재샘플 간격 = 셀 절반 → 8 이동 + 출발 = 9 스텝
sensor:
  type: beam                 # 빔 스캔 — 알고리즘은 오도메트리 없이 이 점들만 소비한다
  beams: 91                  # 양끝 포함 균일 각도 → 정확히 1° 간격 (fov/(beams−1) = 90/90)
  fov_deg: 90.0              # 전방 부채꼴 ±45° — 닫힌 방이라 모든 빔은 어딘가에 맞는다(미스 없음)
  range_max: 3.5             # 어떤 스텝에서든 보이는 면 전체를 덮는 사거리 — 잘림 없음 (위 주석)
  sigma_range: 0.02          # LiDAR 급 거리 노이즈 σ — 등록의 오차 바닥의 절반
odom_noise:                  # 알고리즘이 소비하지 않는 오도메트리 — 정본과 정확히 일치한다 (위 주석)
  sigma_xy: 0.0
  sigma_theta: 0.0
seed: 42
