# features 갈래의 정본 시나리오 — 벽 없는 블롭 필드. 이 갈래의 주제는 랜드마크가 어디서
# 오는가이지 방이 아니므로 벽이 없다: 빔은 블롭에 맞은 점만 내고(미스는 점 없음) 그래서 스캔은
# 처음부터 밀도 클러스터 후보들뿐이다. 블롭 하나하나가 GT 랜드마크 점(셀 중심)이고 목록 순서가
# 곧 id 다 — 발견 순서(스캔 인덱스 = 출발 heading 기준 방위각 오름차순: A −7.1°, B 0°, C +7.1°)로
# 적었다. 경로가 직선인 이유도 같다: 추정은 게이지+오도메리치고(σ=0 이므로 정본과 정확히 같아)
# 클러스터는 스텝이 쌓일수록 밀해지는데, 방향이 바뀌면 그건 또 다른 실험이 된다.
# 기하: 셀 하나짜리 블롭 3개 — A (4.75,1.25), B (6.25,1.75), C (4.75,2.25)(셀 중심). 출발점
# (0.75,1.75)에서 부채꼴(±45°) 안의 각폭은 A ≈ −11.3°..−3.8°, B ≈ ±2.7°, C 대칭 — 빔 인덱스
# 덩어리가 이 순서로 겹치지 않아 id 가 안정적이다. 경로 y=1.75 는 B 중심선과 같은 선이고 끝점
# (3.25,1.75) 에서 B 정면(x=6.0)까지 2.75 m 를 남기고 선다. σ_range 0.02 가 클러스터의 법선
# 방향 두께를 만들고(NDT 와 같은 정직한 센서 등급), 접근할수록 빔 간격 r·Δθ 가 좁아져 구름이
# 밀해진다 — 기본 eps/min_pts 에서 세 블롭 모두 t=0 에 core 를 얻는 이유다.
map: ../grid/blobs01.yaml
path:                        # 웨이포인트(world 좌표) — y=1.75 직선을 동쪽으로 2.5 m
  - [0.75, 1.75]             # 출발 — 게이지 포즈(x0/y0/theta_deg)와 같은 점
  - [3.25, 1.75]             # 정지 — B 정면까지 2.75 m 를 남김(위 주석)
step_meters: 0.25            # 등아크 재샘플 간격 → 10 이동 + 출발 = 11 스텝
sensor:
  type: beam                 # 빔 스캔 — 이 갈래의 입력은 날 점들이다(랜드마크 관측이 아니다)
  beams: 91                  # 양끝 포함 균일 각도 → 정확히 1° 간격(fov/(beams−1) = 90/90)
  fov_deg: 90.0              # 전방 부채꼴 ±45° — 블롭 밖은 미스(점 없음), 잘림 없음
  range_max: 6.0             # 출발점에서 가장 먼 가시점(B 꼭짓점 ≈ 5.76)을 덮는 사거리
  sigma_range: 0.02          # LiDAR 급 거리 노이즈 σ — 클러스터 두께의 실측 요소
landmarks:                   # GT 랜드마크 점(측정·시각화 전용 — 알고리즘은 읽지 않는다) — id = 목록 순서
  - [4.75, 1.25]             # A — 하단 블롭 (출발 기준 방위각 −7.1°)
  - [6.25, 1.75]             # B — 정면 블롭 (0°)
  - [4.75, 2.25]             # C — 상단 블롭 (+7.1°, A 와 대칭)
odom_noise:                  # 알고리즘이 소비하는 오도메트리 — 정본과 정확히 일치(σ=0)
  sigma_xy: 0.0
  sigma_theta: 0.0
seed: 42
