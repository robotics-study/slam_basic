# 같은 맵, 직선 투어 — 센서가 점 랜드마크인 시나리오. id 는 목록 순서(0부터)이고
# association 은 주어진다고 정직하게 가정한다(FastSLAM 원논문이 그렇다). 가시성은
# GT pose 에서 랜드마크 점까지 선분이 occupied 셀을 통과하지 않음 — 벽 너머
# 랜드마크는 관측되지 않고 드로도 소비하지 않는다.
#
# 랜드마크 10개는 전부 free 셀 중심에 있다(landmark_visible 은 닫힌 셀 정사각형을
# 쓰므로 occupied 셀 안에 있는 점은 영원히 관측 불가 — 이전 세대의 이 시나리오가
# 바로 그 함정에 빠져 있었다). 블록 A 모서리 안쪽 자유 셀 4개, 문틀 양 끝 안쪽 2개,
# 블록 B 모서리 안쪽 자유 셀 4개. 실측 가시성(스텝은 step_meters 0.4 재샘플 인덱스):
#   id 0,2,3,4,5 는 t=0 부터 보인다(출발점에서 A 좌측 두 개와 문틀 두 개가 시야),
#   id 1 은 로봇이 블록 A 를 지나치는 t=3 에 늦게 태어나고(slot ≠ id 의 교육 포인트),
#   id 6/8 은 문을 지난 뒤 t=10/t=13, id 7/9 는 t=20/t=23 에 보인다.
map: ../grid/office01.yaml
path:
  - [0.875, 4.625]           # 게이지 출발점 — 문 gap(row 14–21)과 같은 y
  - [10.125, 4.625]          # 좌→우 직선; θ₀ = atan2(0, +dx) = 정확히 0
step_meters: 0.4             # 총 9.25 m → s = 0, 0.4, …, 9.2 에 24점, 잔여 0.05 로 마지막 점 하나 더 — 총 25 스텝
sensor:
  type: landmarks
  range_max: 6.0             # 이 거리 너머 랜드마크는 관측되지 않고 드로도 소비하지 않는다
  sigma_range: 0.05          # m
  sigma_bearing: 0.03        # rad
landmarks:                   # free 셀 중심들 (world 좌표) — id = 목록 순서
  - [1.375, 6.875]           # 0: 블록 A 위-왼 모서리 안쪽 셀 (r8,c5)
  - [2.375, 6.875]           # 1: 블록 A 위-오른 모서리 바깥 셀 (r8,c9) — t=3 에 늦게 태어난다
  - [1.375, 6.375]           # 2: 블록 A 아래-왼 모서리 안쪽 셀 (r10,c5)
  - [2.375, 6.375]           # 3: 블록 A 아래-오른 모서리 바깥 셀 (r10,c9)
  - [6.625, 5.375]           # 4: 문틀 위쪽 끝 안쪽 셀 (r14,c26)
  - [6.625, 3.625]           # 5: 문틀 아래쪽 끝 안쪽 셀 (r21,c26)
  - [8.375, 2.875]           # 6: 블록 B 위-왼 모서리 바깥 셀 (r24,c33)
  - [10.375, 2.875]          # 7: 블록 B 위-오른 모서리 바깥 셀 (r24,c41)
  - [8.375, 1.875]           # 8: 블록 B 아래-왼 모서리 바깥 셀 (r28,c33)
  - [10.375, 1.875]          # 9: 블록 B 아래-오른 모서리 바깥 셀 (r28,c41)
odom_noise:
  sigma_xy: 0.05
  sigma_theta: 0.035
seed: 42
