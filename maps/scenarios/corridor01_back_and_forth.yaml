# 폭 좁은 복도에 문 협착부(기둥)가 세 번 반복된다 — filtering 갈래의 무대.
# 기둥 열을 6·13·19(불균등 간격)에 두어 복도가 평면 이동으로 자기와 똑같이 보이는
# 주기성을 갖지 않게 한다 — 균등 간격이면 스캔이 매 구간에서 동일해 전역 국소화가
# 원리상 불가능하다. 왕복이라 귀환에서 같은 특징을 다시 관측한다(재수렴의 장면).
# 센서는 전방향(fov 360): 앞 부채꼴만으로는 진행 방향(θ=0 vs π)을 원리상 구별할 수 없어
# 히스토그램 필터가 수렴하지 못한다 — 전방향 서명은 셀의 전체 원형 프로파일이라 회전
# 동치가 불가능하다. beams−1=360 이니 각도 눈금 step = radians(360)/360 = π/180 정확히
# 1°이고, 상태의 heading 격자가 이 눈금과 같은 격자를 쓴다(정본 헤딩이 격자점에 정확히
# 올라 우도의 기댓값이 노이즈만 남기고 소거된다).
#
# 오도메트리 노이즈는 격자와 짝을 이룬다. 웨이포인트가 셀 중심에 있고 step_meters 가 셀
# 크기(0.5)와 같아서 정본 이동은 언제나 정확히 셀 한 칸 — sigma_xy 0.05 는 양자(0.5m)보다
# 훨씬 작아 양자화를 절대 넘지 않으므로 셀 단위 운동은 명령 그대로다. sigma_theta 는
# 0: 상태 공간이 1° 눈금으로 이산화됐으니 2°짜리 회전 노이즈는 표현조차 못 하는 불확실성이다.
# 격자 위에 살지 않는 헤딩 노이즈는 히스토그램 필터의 운동 모델이 정직하게 표현할 수 있는
# 것이 아니고(입자 필터 갈래의 무대다), 이 시나리오는 격자 일치(lattice-matched) 케이스를
# 가르친다 — commanded twist 는 눈금의 정수배, 불확실성의 전부는 slip 하나다.
map: ../grid/corridor01.yaml
path:                        # 웨이포인트(world 좌표, 셀 중심) — 왕복
  - [0.75, 1.75]             # cell (r3,c1) — 출발, 동쪽
  - [11.75, 1.75]            # cell (r3,c23) — 끝에서 회전
  - [0.75, 1.75]             # cell (r3,c1) — 귀환
step_meters: 0.5             # 등아크 재샘플 간격 = 셀 크기 → 왕복 45 스텝
sensor:
  type: beam                 # 빔 스캔 — 알고리즘은 자기 추정 자세로 world 를 복원해야 한다
  beams: 361                 # fov 를 양끝 포함 균일 각도로 쪼갠다 (1° 간격)
  fov_deg: 360.0             # 전방향 — 위 주석의 회전 동치 불가능성 때문
  range_max: 6.0             # 이보다 먼 광선은 miss — 점을 내지 않는다
  sigma_range: 0.05          # 빔 거리 가우시안 σ (m) — 셀 모서리 판별 여유(餘裕)보다 훨씬 작다
odom_noise:                  # 알고리즘이 소비하는 noisy 오도메트리 (spec/data_formats.md 의 드로 순서)
  sigma_xy: 0.05             # 양자화 미만의 위치 노이즈 — 셀 경계를 넘지 않는다
  sigma_theta: 0.0           # 헤딩은 격자의 정수배만 — 위 주석의 격자 일치 계약
seed: 42
