# 주기적(baffle) 복도 — 전역 국소화가 원리상 모호한 무대. corridor01 이 기둥 간격을
# 불균등하게 배치해 첫 스캔에서 가설을 하나씩 죽여갔다면, 이 맵은 기둥 4 개를 정확히
# 4 셀(2 m) 간격으로 균등 배치한다. range_max 2.5 m 은 인접 기둥 면(±0.75 m)만 사정거리에
# 넣고 다다음 기둥 면(≥ 2.75 m)은 항상 밖으로 밀어낸다 — 그래서 사정거리 안의 구조가
# 주기적 구간 어디서나 정확히 평행이동 동일하고, 첫 스캔의 가설이 (3 셀 × heading 쌍둥이)로
# 남는다. 모호성은 진짜이고 정보결핍이다: 어떤 스캔도 구간을 구별하지 못한다.
# 기둥(열 6·10·14·18)은 행 1,2,4,5 를 막고 중앙 행(row 3)만 노치로 통과한다 — 왕복 경로는
# 항상 중앙선을 탄다. 열 19–32 의 열린 방(테일)이 유일한 비대칭부: 참 자세가 마지막 기둥
# 노치로 돌아가면 구별 구조가 사정거리에 다시 들어오고 belief 가 단일 상태로 무너진다.
# 반대로 테일 깊숙한 곳에서는 어떤 면도 2.5 m 안에 없어 스캔이 전부 miss — 관측 맹지에서
# slip 이 질량을 다시 번지게 한다(칩 p_slip=0 에선 한 번 무너진 belief 가 그대로 유지된다).
# 시작 웨이포인트 (4.25,1.75) 는 첫 구간(열 7–9)의 중심 셀 c8 — 모호한 3 구간의 하나다.
# 오도메트리 노이즈는 corridor01 과 같은 격자 일치 계약: 웨이포인트는 셀 중심, step 은 셀
# 크기(0.5), sigma_xy 0.05 는 양자 미만, sigma_theta 0 — 이 시나리오가 가르치는 것은 운동
# 불확실성이 아니라 관측의 정보 부족 그 자체다.
map: ../grid/corridor02.yaml
path:                        # 웨이포인트(world 좌표, 셀 중심) — 왕복
  - [4.25, 1.75]             # cell (r3,c8)  — 첫 구간의 중심, 출발
  - [13.25, 1.75]            # cell (r3,c26) — 테일(열고 넓은 방)의 중심에서 회전
  - [4.25, 1.75]             # cell (r3,c8)  — 귀환
step_meters: 0.5             # 등아크 재샘플 간격 = 셀 크기 → 왕복 36 이동 + 출발 = 37 스텝
sensor:
  type: beam                 # 빔 스캔 — 알고리즘은 자기 추정 자세로 world 를 복원해야 한다
  beams: 361                 # fov 를 양끝 포함 균일 각도로 쪼갠다 (1° 간격)
  fov_deg: 360.0             # 전방향 — heading 쌍둥이(θ=0 vs π)의 구별도 진행으로만 가능
  range_max: 2.5             # 모호성의 설계 변수: 인접 면만 보고 다다음 면은 반드시 버린다
  sigma_range: 0.05          # 빔 거리 가우시안 σ (m) — 셀 모서리 판별 여유보다 훨씬 작다
odom_noise:                  # 알고리즘이 소비하는 noisy 오도메트리 (spec/data_formats.md 의 드로 순서)
  sigma_xy: 0.05             # 양자화 미만의 위치 노이즈 — 셀 경계를 넘지 않는다
  sigma_theta: 0.0           # 헤딩은 격자의 정수배만 — 격자 일치 계약
seed: 42
