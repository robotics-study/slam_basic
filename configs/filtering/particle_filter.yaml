# particle_filter — 부트스트랩 입자 필터(Thrun, Burgard & Fox 2005 ch. 4; 뿌리는 Gordon·Salmond·Smith
# 의 부트스트랩 필터와 Fox·Burgard·Dellaert·Thrun(AAAI 1999) 및 Dellaert·Fox·Burgard·Thrun(ICRA 1999)
# 의 초기 Monte Carlo 국소화). 상태는 연속 자세
# (x, y, θ)이고 belief 는 표본 덩어리다: 매 스텝 입자마다 운동 노이즈를 그린다(x ⊕ (u + ε)),
# 관측은 스캔 점마다 기댓값 raycast 의 가우시안으로 가중치를 곱하고, ESS < N/2 이면 체계적
# 리샘플링으로 죽은 입자를 산 입자의 사본으로 바꾼다.
#
# 초기화: 선언된 출발 셀(x0/y0 가 가리키는 셀) 안에서 균일 × heading 은 [−π, π) 전체 — 포지션은
# 셀 하나로 알려져 있고 방향은 전혀 모른다(지역 국소화; 전역 판정은 mcl 갈래의 몫). 시나리오의
# odom_noise 는 0: 이 갈래에서 드리프트는 필터의 σ_xy/σ_θ 가 선언하고 입자가 직접 그린다.
# sigma_range 는 시나리오 센서에서 주입된다(주입 계약) — 기본값은 자리채우기다.
algorithm: particle_filter
section: filtering
params:
  - name: seed
    type: int
    default: 42
    description: >-
      입자 샘플링과 리샘플링의 splitmix64 스트림 — demo 가 시나리오의 seed 를 그대로 주입한다
      (시뮬레이터의 노이즈 스트림과 같은 값, 별개의 스트림). 부트스트랩 필터는 결정적으로
      재생되려면 이 seed 에 의존한다.
  - name: n_particles
    type: int
    default: 500
    min: 8
    max: 4096
    description: >-
      입자 수 N — belief 의 표본 수. 균일 초기화는 이 수로 출발 셀 × 전 heading 의 지지집합을
      덮어야 하므로 작으면 운에 의존한다(빈약의 교과서적 실패). 리샘플링 트리거는 ESS < N/2.
  - name: x0
    type: float
    default: 4.25
    description: >-
      출발 셀의 중심 x — 입자 초기화는 이 점이 속한 셀 안에서만 균일하다(포지션은 셀 하나로
      알려져 있다). 기본값은 시나리오 출발 셀 (r3,c8) 의 중심(정확한 이진 부동소수).
  - name: y0
    type: float
    default: 1.75
    description: 출발 셀 중심의 y — 위와 동일.
  - name: range_max
    type: float
    default: 2.5
    min: 0.1
    description: >-
      최대 측정 거리(m) — demo 가 시나리오 센서의 range_max 로 주입한다. 이보다 먼 광선은
      miss — 점을 내지 않고, 입자의 기댓값은 sentinel(range_max + resolution) 그대로다.
  - name: sigma_range
    type: float
    default: 0.3
    min: 0.001
    description: >-
      빔 거리 가우시안 σ (m) — demo 가 시나리오 센서의 sigma_range 로 주입한다. 우도의 뭉툭함:
      입자가 살아남으려면 기댓값이 관측과 이 폭 안에서 만나야 하므로, 날카로운 σ 는 유한 N 의
      균일 샘플링이 지지집합을 덮지 못하게 만든다(빈약). 시나리오는 0.3 을 선언한다.
  - name: sigma_xy
    type: float
    default: 0.05
    min: 0.001
    max: 0.5
    description: >-
      운동 모델의 위치 노이즈 σ — 필터가 도착한 twist 에 스스로 더하는 ε 의 폭(주입이 아니다:
      이 갈래의 시나리오는 오도메트리를 정확히 명령하고, 드리프트는 여기서 선언된다). 입자마다
      독립적으로 그려진다.
  - name: sigma_theta
    type: float
    default: 0.05
    min: 0.001
    max: 3.14159265358979
    description: >-
      운동 모델의 헤딩 노이즈 σ (rad) — 격자 갈래가 정직하게 표현할 수 없었던 바로 그 불확실성
      (corridor01 주석의 예고)이 여기 있다. 입자마다 독립적으로 그려진다.
scenarios:
  - corridor03_drift
