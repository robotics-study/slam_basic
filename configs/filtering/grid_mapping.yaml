# grid_mapping — 알려진 자세(무노이즈 오도메트리 + 선언된 출발 자세) 위의 log-odds 점유
# 격자. 셀은 독립(naive independence — 이것이 모델이다)이고 갱신은 대칭: 점의 빔이 착지한
# 셀 +logit(p), 통과한 셀 −logit(p). miss 는 점을 내지 않고 점은 아무것도 말하지 않으므로
# 미지의 셀은 prior(log-odds 0 = 확률 0.5, 절대 점유로 취급되지 않는다)를 유지한다.
algorithm: grid_mapping
section: filtering
params:
  - name: p_hit
    type: float
    default: 0.9
    min: 0.5
    max: 0.999999
    description: >-
      대칭 역모델의 확률 — 빔이 점유 셀에서 정확히 끝나고(p_hit) 자유 셀을 통과할
      (같은 p) 확률. 갱신은 ±logit(p_hit) 하나의 크기다(0.5 이하는 역모델이 무정보).
  - name: x0
    type: float
    default: 5.875
    description: >-
      앵커 — 매핑 갈래는 자세를 추정하지 않는다: 오도메트리가 선언된 이 출발 자세에
      얹힌다. 기본값은 투어 출발 셀 중심(정확한 이진 부동소수)이고 시나리오가 정본과
      같은 값으로 선언하므로 추정 자세는 정본과 반올림 수준까지 일치한다.
  - name: y0
    type: float
    default: 4.375
    description: 앵커의 y — 위와 동일, 출발 셀 중심(정확한 이진 부동소수).
  - name: theta_deg
    type: float
    default: 180.0
    description: >-
      앵커의 heading(도) — 투어는 정확히 서쪽으로 시작해 atan2(+0.0, −5.0) = +π,
      그래서 math.radians(180.0) 은 정본 출발 heading 과 비트 단위로 같다.
scenarios:
  - office01_tour
